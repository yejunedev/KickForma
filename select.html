<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>전술 성향 선택 | KickForma</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html"><span class="brand-ball">⚽</span><span>Kick<span class="brand-green">Forma</span></span></a>
    <nav class="desktop-nav"><a href="index.html">홈</a><a class="active" href="select.html">포메이션 추천</a><a href="result.html">추천 결과</a></nav>
    <button class="menu-button" id="menuButton" aria-label="메뉴 열기">☰</button>
  </header>

  <main class="quiz-page">
    <div class="quiz-heading">
      <p class="section-kicker">TACTICS CHECK</p>
      <h1>우리 팀의 전술 성향을 알려주세요.</h1>
      <p>각 질문에서 우리 팀과 가장 가까운 스타일을 선택해 주세요.</p>
    </div>
    <div class="quiz-progress">
      <div class="progress-steps" id="progressSteps">
        <span class="progress-step current">1</span><span class="progress-line"></span>
        <span class="progress-step">2</span><span class="progress-line"></span>
        <span class="progress-step">3</span><span class="progress-line"></span>
        <span class="progress-step">4</span><span class="progress-line"></span>
        <span class="progress-step">5</span><span class="progress-line"></span>
        <span class="progress-step">6</span><span class="progress-line"></span>
        <span class="progress-step">7</span><span class="progress-line"></span>
        <span class="progress-step">8</span>
      </div>
      <div class="progress-caption"><strong id="questionCount">1 / 8</strong><span id="progressPercent">진행률 12%</span></div>
      <div class="progress-track"><span id="progressBar"></span></div>
    </div>

    <section class="question-panel">
      <div class="question-top"><span class="question-label">QUESTION <span id="questionNumber">01</span></span><span class="multi-label">하나를 선택하세요</span></div>
      <h2 id="questionTitle">우리 팀의 공격 전개 방식은 어떤 스타일인가요?</h2>
      <p id="questionDesc">가장 가까운 성향을 선택해 주세요.</p>
      <div class="options-grid" id="optionsGrid"></div>
      <div class="quiz-footer">
        <button class="button button-ghost" id="prevButton" disabled>← 이전</button>
        <span class="saved-note">✓ 선택 내용은 이 페이지에서 유지됩니다</span>
        <button class="button button-primary" id="nextButton">다음 <span>→</span></button>
      </div>
    </section>
    <p class="quiz-footnote">선택 결과는 포메이션 추천을 위한 참고 자료로 사용됩니다.</p>
  </main>
  <footer><a class="brand footer-brand" href="index.html"><span class="brand-ball">⚽</span><span>Kick<span class="brand-green">Forma</span></span></a><small>나에게 맞는 전술, 나에게 맞는 포메이션.</small></footer>
  <script src="script.js"></script>
</body>
</html>
