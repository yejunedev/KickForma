        <span>Kick<span class="brand-accent">Forma</span></span>

      <nav class="top-auth-nav" id="topAuthNav">
        <a href="login.html">로그인</a>
        <span class="divider">|</span>
        <a href="login.html">회원가입</a>

    </header>

        <h1>
          당신의 팀에<br />
          가장 잘 맞는<br />

        <p class="sub-copy">

        <a href="login.html" class="cta-pill-btn" id="startBtn">

    </main>

  <script>
    const rawUser = localStorage.getItem('kickforma_user');
    const user = rawUser ? JSON.parse(rawUser) : null;
    const nav = document.getElementById('topAuthNav');
    const startBtn = document.getElementById('startBtn');

    if (user) {
      nav.innerHTML = `
        <a href="mypage.html">내 정보</a>
        <span class="divider">|</span>
        <button type="button" id="landingLogoutBtn" class="nav-logout-btn">로그아웃</button>
      `;
      startBtn.href = 'home.html';

      document.getElementById('landingLogoutBtn').addEventListener('click', () => {
        localStorage.removeItem('kickforma_user');
        alert('로그아웃 되었습니다.');
        window.location.reload();
      });
    } else {
      startBtn.href = 'login.html';
    }
  </script>
</body>
</html>
