<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>내 전술함 | KickForma</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="mypage.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="KickForma 홈">
      <span class="brand-ball">⚽</span><span>Kick<span class="brand-green">Forma</span></span>
    </a>
    <nav class="desktop-nav">
      <a href="index.html">홈</a>
      <a href="select.html">포메이션 추천</a>
      <a href="result.html">추천 결과</a>
    </nav>
    <button class="menu-button" id="menuButton" aria-label="메뉴 열기">☰</button>
  </header>

  <main class="mypage-container">
    <section class="mypage-header">
      <div>
        <p class="section-kicker">MY TACTICS ARCHIVE</p>
        <h1 id="managerTitle">감독님의 전술 추천 기록</h1>
        <p>지금까지 진단받은 포메이션 추천 이력이 최신순으로 저장됩니다.</p>
      </div>
      <a class="button button-primary" href="select.html"><span>⚽</span> 새 전술 진단하기</a>
    </section>

    <section id="historyContainer" class="history-grid"></section>
  </main>

  <footer>
    <a class="brand footer-brand" href="index.html">
      <span class="brand-ball">⚽</span><span>Kick<span class="brand-green">Forma</span></span>
    </a>
    <small>나에게 맞는 전술, 나에게 맞는 포메이션.</small>
  </footer>

  <script src="script.js"></script>
  <script>
    async function loadMyHistory() {
      const user = getCurrentUser();
      if (!user) {
        alert('로그인이 필요한 페이지입니다.');
        window.location.href = 'login.html';
        return;
      }

      document.getElementById('managerTitle').textContent = `${user.nickname}님의 전술 추천 기록`;
      const container = document.getElementById('historyContainer');

      try {
        const res = await fetch(`/api/results/${user.id}`);
        if (!res.ok) throw new Error('기록 조회 실패');

        const records = await res.json();

        if (records.length === 0) {
          container.className = '';
          container.innerHTML = `
            <div class="empty-box">
              <p class="empty-title">아직 저장된 추천 기록이 없습니다.</p>
              <p class="empty-desc">포메이션 추천을 완료하면 이곳에 자동으로 기록됩니다!</p>
              <a class="button button-primary" href="select.html">지금 진단 시작하기 →</a>
            </div>
          `;
          return;
        }

        container.innerHTML = records.map(item => {
          const dateStr = new Date(item.created_at).toLocaleString('ko-KR', {
            year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit'
          });
          return `
            <article class="history-card">
              <div>
                <div class="history-top">
                  <span class="formation-badge">⚽ ${item.formation_name}</span>
                  <span class="score-badge">적합도 ${item.score}점</span>
                </div>
                <p class="history-summary">${item.summary}</p>
                <div class="history-tip"><strong>💡 코칭 포인트:</strong> ${item.tip || '기본 전술 운영'}</div>
              </div>
              <div class="history-date">진단 일시: ${dateStr}</div>
            </article>
          `;
        }).join('');
      } catch (err) {
        console.error(err);
        container.innerHTML = '<p>기록을 불러오는 중 오류가 발생했습니다.</p>';
      }
    }

    loadMyHistory();
  </script>
</body>
</html>
